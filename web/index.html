<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOND — Cyber AI Leak Detection Command Center</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM -->
  <script src="vendor_react.min.js"></script>
  <script src="vendor_react-dom.min.js"></script>

  <!-- Fallback datasets for zero-config offline execution -->
  <script src="network.js"></script>
  <script src="scenarios.js"></script>

  <style>
    :root {
      --bg-dark: #0A0E17;
      --bg-surface: #0F172A;
      --bg-card: #131D31;
      --bg-card-hover: #19253E;

      --border-subtle: #1E293B;
      --border-bright: #334155;
      --border-active: #0284C7;

      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-faint: #64748B;

      --blue-primary: #0284C7;
      --blue-hover: #0369A1;
      --cyan-bright: #38BDF8;

      --emerald-solid: #10B981;
      --emerald-bg: #06281E;

      --amber-sensor: #F59E0B;
      --amber-bg: #381E04;

      --crimson-leak: #EF4444;
      --crimson-bg: #2D0B0E;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .num, [data-num] {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Layout Frame */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* Top Navigation Header */
    header.top-nav {
      height: 52px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 50;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: var(--blue-primary);
      border: 1px solid var(--cyan-bright);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      border-left: 1px solid var(--border-subtle);
      padding-left: 12px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .nav-telemetry {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .telemetry-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 4px;
      background: #1E293B;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald-solid);
    }

    .simulated-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1E293B;
      border: 1px solid #334155;
      color: var(--cyan-bright);
    }

    /* Main Grid: Map & Controls */
    .main-workspace {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    /* Left Map Canvas */
    .map-section {
      flex: 66;
      background: #070B12;
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-subtle);
      min-width: 0;
    }

    .map-header-bar {
      position: absolute;
      top: 14px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .map-status-badge {
      pointer-events: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-bright);
      padding: 6px 14px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-main);
    }

    .map-legend-box {
      pointer-events: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-bright);
      padding: 6px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .legend-icon-sensor {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber-sensor);
    }

    .legend-icon-leak {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--crimson-leak);
    }

    .svg-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    svg.network-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* Right Control & Telemetry Panel */
    .side-telemetry {
      flex: 34;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 18px;
      gap: 14px;
      min-width: 320px;
      border-left: 1px solid var(--border-subtle);
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .glass-card:hover {
      border-color: var(--border-bright);
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Segmented pill control */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .control-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .segmented-group {
      display: inline-flex;
      background: #090D16;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .segmented-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .segmented-btn:hover {
      color: var(--text-main);
      background: #1E293B;
    }

    .segmented-btn.active {
      background: var(--blue-primary);
      color: #FFFFFF;
    }

    /* Anomaly Status Alert Banner */
    .alert-banner {
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .alert-banner.normal {
      background: #06281E;
      border: 1px solid #10B981;
      color: #34D399;
    }

    .alert-banner.detected {
      background: #2D0B0E;
      border: 1px solid #EF4444;
      color: #F87171;
    }

    .alert-headline {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-detail {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Candidates Ranking List */
    .candidate-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    .candidate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      background: #0B0F19;
      border: 1px solid var(--border-subtle);
    }

    .candidate-row:hover {
      background: #1E293B;
    }

    .candidate-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-pill {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #1E293B;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rank-pill.gold {
      background: #451A03;
      color: #FBBF24;
      border: 1px solid #D97706;
    }

    .candidate-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .score-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 130px;
    }

    .score-track {
      flex: 1;
      height: 6px;
      background: #1E293B;
      border-radius: 3px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--amber-sensor);
    }

    .score-val {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      width: 32px;
      text-align: right;
    }

    /* Actions Button */
    .btn-reveal {
      width: 100%;
      padding: 9px 16px;
      margin-top: 10px;
      background: #1E293B;
      border: 1px solid #334155;
      color: var(--cyan-bright);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-reveal:hover {
      background: #334155;
      color: #FFFFFF;
    }

    .btn-reveal.active {
      background: #450A0A;
      border-color: #EF4444;
      color: #F87171;
    }

    .verdict-box {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      background: #0B0F19;
      border: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-muted);
    }

    .verdict-box.exact {
      border-color: #10B981;
      background: #06281E;
      color: #34D399;
      font-weight: 600;
    }

    .next-sensor-box {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      background: #381E04;
      border: 1px solid #D97706;
      color: #FBBF24;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Bottom Ribbon Section */
    .ribbon-section {
      height: 220px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .ribbon-toolbar {
      height: 36px;
      background: #0A0E17;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .ribbon-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: #1E293B;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .ctrl-btn:hover {
      background: #334155;
    }

    .ctrl-btn.play-btn {
      background: var(--blue-primary);
      border-color: #0284C7;
      color: #FFFFFF;
    }

    .ctrl-btn.play-btn:hover {
      background: var(--blue-hover);
    }

    .cycle-pill-group {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-left: 12px;
    }

    .cycle-badge {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1E293B;
      color: var(--text-faint);
      border: 1px solid transparent;
      cursor: pointer;
    }

    .cycle-badge:hover {
      background: #334155;
      color: var(--text-main);
    }

    .cycle-badge.active {
      background: var(--blue-primary);
      border-color: var(--blue-primary);
      color: #FFFFFF;
    }

    .ribbon-chart-canvas-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    svg.ribbon-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Tooltip */
    .tooltip-popup {
      position: absolute;
      pointer-events: none;
      background: #0F172A;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-main);
      z-index: 100;
      transform: translate(-50%, -130%);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="root"></div>

<!-- Compiled React Application (Instant 0ms launch, zero compile lag) -->
<script src="app.js"></script>

</body>
</html>
